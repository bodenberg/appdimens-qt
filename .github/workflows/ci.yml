name: ci
on: [push, pull_request]
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  qt: "6.8.*" }
          - { os: ubuntu-latest,  qt: "5.15.2" }
          - { os: windows-latest, qt: "6.8.*" }
          - { os: macos-latest,   qt: "6.10.*" }   # Qt 6.8 still links AGL, gone from the current macOS SDK
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: "${{ matrix.qt }}", cache: true }
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
        env: { QT_QPA_PLATFORM: offscreen, QT_QUICK_BACKEND: software }
      - name: qmake integration (appdimens-qt.pri + QML module)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build-qmake && cd build-qmake
          qmake ../tests/qmake/qmake_check.pro && make -j4
          QT_QPA_PLATFORM=offscreen ./qmake_check
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated token API is up to date
        run: python3 tools/gen_properties.py --check
